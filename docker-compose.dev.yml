version: "3.9"

services:

  api-gateway:
    environment:
      NODE_ENV: development
    volumes:
      - ./express-gateway/src:/app/src   
    command: ["node", "--watch", "src/index.js"]

  oauth-server:
    volumes:
      - ./oauth-server/src:/app/src

  php-passenger:
    volumes:
      - ./php-passenger:/var/www/html    
    environment:
      APP_DEBUG: "true"

  php-fleet:
    volumes:
      - ./php-fleet:/var/www/html
    environment:
      APP_DEBUG: "true"

  php-stop:
    volumes:
      - ./php-stop:/var/www/html
    environment:
      APP_DEBUG: "true"

  python-ml:
    volumes:
      - ./python-ml-service:/app
    command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "5000", "--reload"]

  mysql:
    ports:
      - "3306:3306"  

  rabbitmq:
    ports:
      - "5672:5672"   
