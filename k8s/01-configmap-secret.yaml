apiVersion: v1
kind: ConfigMap
metadata:
  name: smarttransport-config
  namespace: smarttransport
data:
  DB_NAME: "smarttransport"
  DB_HOST: "mysql"
  DB_PORT: "3306"
  RABBITMQ_HOST: "rabbitmq"
  RABBITMQ_PORT: "5672"
  OAUTH_SERVER_URL: "http://oauth-server:3002"
  PASSENGER_SERVICE_URL: "http://php-passenger:8000"
  FLEET_SERVICE_URL: "http://php-fleet:8001"
  STOP_SERVICE_URL: "http://php-stop:8002"
  PYTHON_ML_URL: "http://python-ml:5000"
  NODE_ENV: "production"
---
apiVersion: v1
kind: Secret
metadata:
  name: smarttransport-secret
  namespace: smarttransport
type: Opaque
stringData:
  MYSQL_ROOT_PASSWORD: "changeme_root_password"
  DB_USER: "root"
  DB_PASS: "changeme_root_password"
  RABBITMQ_USER: "admin"
  RABBITMQ_PASS: "changeme_rabbitmq_password"
  JWT_SECRET: "changeme_jwt_secret"
  GRAFANA_USER: "admin"
  GRAFANA_PASS: "changeme_grafana_password"