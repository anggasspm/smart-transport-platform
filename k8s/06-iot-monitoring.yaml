apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: smarttransport
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s

    scrape_configs:
      - job_name: 'api-gateway'
        static_configs:
          - targets: ['api-gateway:3000']
        metrics_path: '/metrics'

      - job_name: 'php-passenger'
        static_configs:
          - targets: ['php-passenger:8000']
        metrics_path: '/metrics'

      - job_name: 'php-fleet'
        static_configs:
          - targets: ['php-fleet:8001']
        metrics_path: '/metrics'

      - job_name: 'php-stop'
        static_configs:
          - targets: ['php-stop:8002']
        metrics_path: '/metrics'

      - job_name: 'python-ml'
        static_configs:
          - targets: ['python-ml:5000']
        metrics_path: '/metrics'

      - job_name: 'rabbitmq'
        static_configs:
          - targets: ['rabbitmq:15692']
        metrics_path: '/metrics'

      - job_name: 'oauth-server'
        static_configs:
          - targets: ['oauth-server:3002']
        metrics_path: '/metrics'

      - job_name: 'node-red'
        static_configs:
          - targets: ['node-red:1880']
        metrics_path: '/metrics'
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: node-red
  namespace: smarttransport
spec:
  replicas: 1
  selector:
    matchLabels: { app: node-red }
  template:
    metadata:
      labels: { app: node-red }
    spec:
      containers:
        - name: node-red
          image: nodered/node-red:3.1
          ports: [{ containerPort: 1880 }]
---
apiVersion: v1
kind: Service
metadata:
  name: node-red
  namespace: smarttransport
spec:
  selector: { app: node-red }
  ports: [{ port: 1880, targetPort: 1880 }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: smarttransport
spec:
  replicas: 1
  selector:
    matchLabels: { app: prometheus }
  template:
    metadata:
      labels: { app: prometheus }
    spec:
      containers:
        - name: prometheus
          image: prom/prometheus:v2.48.0
          ports: [{ containerPort: 9090 }]
          volumeMounts:
            - { name: prom-config, mountPath: /etc/prometheus }
      volumes:
        - name: prom-config
          configMap: { name: prometheus-config }
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: smarttransport
spec:
  selector: { app: prometheus }
  ports: [{ port: 9090, targetPort: 9090 }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: smarttransport
spec:
  replicas: 1
  selector:
    matchLabels: { app: grafana }
  template:
    metadata:
      labels: { app: grafana }
    spec:
      containers:
        - name: grafana
          image: grafana/grafana:10.2.0
          ports: [{ containerPort: 3000 }]
          env:
            - name: GF_SECURITY_ADMIN_USER
              valueFrom: { secretKeyRef: { name: smarttransport-secret, key: GRAFANA_USER } }
            - name: GF_SECURITY_ADMIN_PASSWORD
              valueFrom: { secretKeyRef: { name: smarttransport-secret, key: GRAFANA_PASS } }
            - name: GF_USERS_ALLOW_SIGN_UP
              value: "false"
          envFrom:
            - secretRef: { name: smarttransport-secret }
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: smarttransport
spec:
  selector: { app: grafana }
  ports: [{ port: 3000, targetPort: 3000 }]