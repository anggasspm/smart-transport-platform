apiVersion: apps/v1
kind: Deployment
metadata:
  name: node-red
  namespace: smarttransport
spec:
  replicas: 1
  selector:
    matchLabels: { app: node-red }
  template:
    metadata:
      labels: { app: node-red }
    spec:
      containers:
        - name: node-red
          image: nodered/node-red:3.1
          ports: [{ containerPort: 1880 }]
---
apiVersion: v1
kind: Service
metadata:
  name: node-red
  namespace: smarttransport
spec:
  selector: { app: node-red }
  ports: [{ port: 1880, targetPort: 1880 }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: smarttransport
spec:
  replicas: 1
  selector:
    matchLabels: { app: prometheus }
  template:
    metadata:
      labels: { app: prometheus }
    spec:
      containers:
        - name: prometheus
          image: prom/prometheus:v2.48.0
          ports: [{ containerPort: 9090 }]
          volumeMounts:
            - { name: prom-config, mountPath: /etc/prometheus }
      volumes:
        - name: prom-config
          configMap: { name: prometheus-config }
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: smarttransport
spec:
  selector: { app: prometheus }
  ports: [{ port: 9090, targetPort: 9090 }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: smarttransport
spec:
  replicas: 1
  selector:
    matchLabels: { app: grafana }
  template:
    metadata:
      labels: { app: grafana }
    spec:
      containers:
        - name: grafana
          image: grafana/grafana:10.2.0
          ports: [{ containerPort: 3000 }]
          envFrom:
            - secretRef: { name: smarttransport-secret }
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: smarttransport
spec:
  selector: { app: grafana }
  ports: [{ port: 3000, targetPort: 3000 }]