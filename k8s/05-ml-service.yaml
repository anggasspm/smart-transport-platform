apiVersion: apps/v1
kind: Deployment
metadata:
  name: python-ml
  namespace: smarttransport
spec:
  replicas: 1
  selector:
    matchLabels: { app: python-ml }
  template:
    metadata:
      labels: { app: python-ml }
    spec:
      containers:
        - name: python-ml
          image: smarttransport/python-ml:latest
          imagePullPolicy: Never
          ports: [{ containerPort: 5000 }]
          envFrom:
            - configMapRef: { name: smarttransport-config }
            - secretRef: { name: smarttransport-secret }
          resources:
            requests: { cpu: "200m", memory: "384Mi" }
            limits: { cpu: "500m", memory: "900Mi" }
          readinessProbe:
            httpGet: { path: /health, port: 5000 }
            initialDelaySeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: python-ml
  namespace: smarttransport
spec:
  selector: { app: python-ml }
  ports: [{ port: 5000, targetPort: 5000 }]
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: python-ml-hpa
  namespace: smarttransport
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: python-ml
  minReplicas: 1
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: 60 }