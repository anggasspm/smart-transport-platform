apiVersion: apps/v1
kind: Deployment
metadata:
  name: php-passenger
  namespace: smarttransport
spec:
  replicas: 1
  selector:
    matchLabels: { app: php-passenger }
  template:
    metadata:
      labels: { app: php-passenger }
    spec:
      containers:
        - name: php-passenger
          image: smarttransport/php-passenger:latest
          ports: [{ containerPort: 8000 }]
          envFrom:
            - configMapRef: { name: smarttransport-config }
            - secretRef: { name: smarttransport-secret }
          readinessProbe:
            httpGet: { path: /health, port: 8000 }
            initialDelaySeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: php-passenger
  namespace: smarttransport
spec:
  selector: { app: php-passenger }
  ports: [{ port: 8000, targetPort: 8000 }]
---
