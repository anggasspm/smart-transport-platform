apiVersion: apps/v1
kind: Deployment
metadata:
  name: oauth-server
  namespace: smarttransport
spec:
  replicas: 1
  selector:
    matchLabels: { app: oauth-server }
  template:
    metadata:
      labels: { app: oauth-server }
    spec:
      containers:
        - name: oauth-server
          image: smarttransport/oauth-server:latest   
          ports: [{ containerPort: 3002 }]
          envFrom:
            - configMapRef: { name: smarttransport-config }
            - secretRef: { name: smarttransport-secret }
          readinessProbe:
            httpGet: { path: /health, port: 3002 }
            initialDelaySeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: oauth-server
  namespace: smarttransport
spec:
  selector: { app: oauth-server }
  ports: [{ port: 3002, targetPort: 3002 }]
---
# --- API Gateway ---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: smarttransport
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }   
  selector:
    matchLabels: { app: api-gateway }
  template:
    metadata:
      labels: { app: api-gateway }
    spec:
      containers:
        - name: api-gateway
          image: smarttransport/api-gateway:latest
          ports: [{ containerPort: 3000 }]
          envFrom:
            - configMapRef: { name: smarttransport-config }
            - secretRef: { name: smarttransport-secret }
          readinessProbe:
            httpGet: { path: /health, port: 3000 }
            initialDelaySeconds: 10
          livenessProbe:
            httpGet: { path: /health, port: 3000 }
            initialDelaySeconds: 15
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: smarttransport
spec:
  selector: { app: api-gateway }
  ports: [{ port: 3000, targetPort: 3000 }]